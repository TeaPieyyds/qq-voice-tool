name: build

on:
  push:
    branches: [ master, main ]
    paths:
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

# 签名策略：只用 Rinkai。密钥来源优先级见 android/SIGNING.md
#   1. Secrets: SIGN_KEY_B64 / SIGN_CERT_B64
#   2. 仓库内: android/keys/Rinkai.pk8 + Rinkai.x509.pem
# build.sh 会在签名后校验证书 SHA-256，不一致直接失败。

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Fetch Shizuku libs
        run: |
          cd android
          bash fetch-libs.sh

      - name: 检查签名材料
        env:
          SIGN_KEY_B64: ${{ secrets.SIGN_KEY_B64 }}
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
        run: |
          if [ -n "$SIGN_KEY_B64" ] && [ -n "$SIGN_CERT_B64" ]; then
            echo "签名来源：Secrets (SIGN_KEY_B64 / SIGN_CERT_B64)"
          elif [ -f android/keys/Rinkai.pk8 ] && [ -f android/keys/Rinkai.x509.pem ]; then
            echo "签名来源：仓库 android/keys/"
          else
            echo "✗ 没有可用的签名密钥"
            echo "  在 Settings → Secrets and variables → Actions 里配置："
            echo "    SIGN_KEY_B64   = base64 -w0 Rinkai.pk8"
            echo "    SIGN_CERT_B64  = base64 -w0 Rinkai.x509.pem"
            echo "  或者把两个文件提交到 android/keys/"
            exit 1
          fi

      - name: Build APK（Rinkai 签名）
        env:
          SIGN_KEY_B64: ${{ secrets.SIGN_KEY_B64 }}
          SIGN_CERT_B64: ${{ secrets.SIGN_CERT_B64 }}
        run: |
          cd android
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          bash build.sh

      - name: 校验签名指纹
        run: |
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          OUT="$("$BT/apksigner" verify --print-certs android/out/app-signed.apk)"
          echo "$OUT"
          FP="$(echo "$OUT" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*digest: *//' | tr -d ' ')"
          WANT="bcfb3350cf10e3524cb59714d51f0f165d5bc10391acadec67572375233ad79a"
          if [ "$FP" != "$WANT" ]; then
            echo "✗ 证书指纹不对"
            echo "  期望 $WANT"
            echo "  实际 $FP"
            exit 1
          fi
          echo "✓ Rinkai 签名校验通过：$FP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-ball-apk
          path: android/out/app-signed.apk

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'android:versionName="\K[^"]+' android/AndroidManifest.xml | head -1)
          echo "v=$V" >> $GITHUB_OUTPUT
          echo "tag=v$V-build${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 语音球 ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          body: |
            悬浮球版 QQ 语音替换工具。

            **签名**：CN=茶派（Rinkai），证书 SHA-256 `bcfb3350…3ad79a`

            **用法**
            1. 安装后打开「语音球」，授予「显示在其他应用上层」
            2. 屏幕上出现一颗球，拖动可移动，轻点打开面板
            3. QQ 里按住说话 -> 滑到「转文字」松手（先别发送）
            4. 轻点球 -> 选音频 -> 选中最新那条 -> 替换并发送
            5. 回 QQ 点那条语音试听，满意再发

            **需要 Shizuku**（免 root），且已启动服务。

            **限制**：单条最长 60 秒；气泡秒数只是显示值，音频完整播放。
          files: android/out/app-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 构建通知（配了 NOTIFY_WEBHOOK 才发）
      - name: 通知构建完成
        if: success()
        env:
          HOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          [ -z "$HOOK" ] && echo "跳过通知（未配 NOTIFY_WEBHOOK）" && exit 0
          V=$(grep -oP 'android:versionName="\K[^"]+' android/AndroidManifest.xml | head -1)
          SIZE=$(stat -c %s android/out/app-signed.apk)
          URL="https://github.com/${{ github.repository }}/releases"
          MSG="语音球 ${V} 构建完成（build ${{ github.run_number }}）；大小 ${SIZE} 字节；签名 CN=茶派；${URL}"
          PAYLOAD=$(printf '{"msgtype":"text","text":{"content":"%s"}}' "$MSG")
          curl -s -X POST "$HOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"
          echo "已发通知"

      - name: 通知构建失败
        if: failure()
        env:
          HOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          [ -z "$HOOK" ] && exit 0
          MSG="语音球构建失败（build ${{ github.run_number }}），请看 Actions 日志"
          PAYLOAD=$(printf '{"msgtype":"text","text":{"content":"%s"}}' "$MSG")
          curl -s -X POST "$HOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"
