<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>语音球</title>
<style>
  :root{
    --ink:#111315; --sub:#8b9199; --hair:#eceef1; --wash:#f6f7f9;
    --live:#12a150; --dead:#d0d4da; --danger:#b42318;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:transparent;
    font:15px/1.55 -apple-system,system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}

  .card{
    background:#fff;border-radius:20px;overflow:hidden;
    box-shadow:0 10px 34px rgba(15,20,28,.20),0 1px 0 rgba(255,255,255,.7) inset;
    display:flex;flex-direction:column;width:100%;
  }

  .bar{display:flex;align-items:center;gap:8px;padding:13px 15px 10px;flex:none}
  .pip{width:7px;height:7px;border-radius:50%;background:var(--dead);flex:none;
    transition:background .2s}
  .pip.live{background:var(--live);box-shadow:0 0 0 3px rgba(18,161,80,.13)}
  .bar .who{font-size:13px;color:var(--sub);letter-spacing:.2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

  .x{width:26px;height:26px;border:0;background:transparent;padding:0;flex:none;
    display:grid;place-items:center;border-radius:50%;position:relative}
  .x:active{background:var(--wash)}
  .x::before,.x::after{content:'';position:absolute;width:13px;height:1.5px;
    background:#b6bcc4;border-radius:2px}
  .x::before{transform:rotate(45deg)} .x::after{transform:rotate(-45deg)}

  .body{padding:0 15px;flex:1}
  .body::-webkit-scrollbar{width:0}

  .nudge{padding:4px 0 14px}
  .nudge p{margin:0 0 11px;font-size:13px;color:var(--sub);line-height:1.65}

  .go{width:100%;height:46px;border:0;border-radius:13px;background:var(--ink);color:#fff;
    font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;
    letter-spacing:.3px;transition:transform .1s,opacity .15s;font-family:inherit}
  .go:active{transform:scale(.982);opacity:.9}
  .go[disabled]{opacity:.32;transform:none}

  .hd{display:flex;align-items:center;gap:8px;padding:12px 0 6px;
    border-top:1px solid var(--hair);margin-top:2px}
  .hd:first-child{border-top:0;margin-top:0}
  .hd .lab{font-size:11.5px;color:var(--sub);letter-spacing:.5px;flex:1;
    text-transform:uppercase;font-weight:500}
  .hd .act{font-size:12.5px;color:var(--sub);border:0;background:transparent;
    padding:3px 0;font-family:inherit;display:flex;align-items:center;gap:4px}
  .hd .act:active{color:var(--ink)}
  .hd .act[disabled]{opacity:.4}

  .pick{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
  .pick .thumb{width:36px;height:36px;border-radius:10px;background:var(--wash);flex:none;
    display:grid;place-items:center}
  .pick .txt{flex:1;min-width:0}
  .pick .t1{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .t2{font-size:12px;color:var(--sub);margin-top:1px;font-variant-numeric:tabular-nums}

  .preview{padding:0 0 10px}
  .preview audio{width:100%;height:32px}

  .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f6f8}
  .row:last-child{border-bottom:0}
  .row .dot{width:6px;height:6px;border-radius:50%;background:var(--dead);flex:none}
  .row.new .dot{background:var(--live)}
  .row .main{flex:1;min-width:0}
  .row .l1{font-size:13.5px;font-variant-numeric:tabular-nums;
    display:flex;gap:7px;align-items:baseline;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .row .l1 .tm{font-size:11.5px;color:var(--sub);flex:none}
  .row .l2{font-size:11.5px;color:#a9aeb5;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .row .sz{font-size:11.5px;color:var(--sub);flex:none;font-variant-numeric:tabular-nums}
  .row .kill{width:22px;height:22px;border:0;background:transparent;padding:0;flex:none;
    position:relative;border-radius:50%}
  .row .kill:active{background:#fdeceb}
  .row .kill::before,.row .kill::after{content:'';position:absolute;left:5px;top:10px;
    width:12px;height:1.4px;background:#c9ced5;border-radius:2px}
  .row .kill::before{transform:rotate(45deg)} .row .kill::after{transform:rotate(-45deg)}
  .row.sel{background:var(--wash);border-radius:11px;padding-left:8px;padding-right:8px;
    margin:0 -8px;border-bottom-color:transparent}
  .row.sel .dot{background:var(--ink)}

  .latest{padding:11px 0 13px;border-bottom:0}
  .latest .l1{font-size:14.5px}

  .empty{padding:16px 0 20px;text-align:center;font-size:12.5px;
    color:#b0b6bd;line-height:1.75}

  .foot{flex:none;padding:10px 15px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--hair);background:#fff}
  .tip{font-size:11.5px;color:var(--sub);text-align:center;margin-top:7px;line-height:1.45}

  .spin{width:12px;height:12px;border:1.8px solid #dfe3e8;border-top-color:var(--ink);
    border-radius:50%;animation:sp .75s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">

  <div class="bar">
    <span class="pip" id="pip"></span>
    <span class="who" id="who">检查中</span>
    <button class="x" id="btnClose" aria-label="点关窗，长按关掉悬浮球"></button>
  </div>

  <div class="body" id="bodyEl">

    <div class="nudge" id="nudge" style="display:none">
      <p id="nudgeTxt">需要 Shizuku 授权才能读写 QQ 的语音目录。</p>
      <button class="go" id="btnAuth">授权</button>
    </div>

    <div id="audioWrap" style="display:none">
      <div class="hd">
        <span class="lab">音频</span>
        <button class="act" id="btnPick">选择</button>
      </div>

      <div class="pick" id="pick">
        <div class="thumb">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b9199"
            stroke-width="2" stroke-linecap="round">
            <path d="M12 3v11"/><path d="M8 7v7"/><path d="M16 7v7"/>
            <path d="M4 10v2"/><path d="M20 10v2"/>
          </svg>
        </div>
        <div class="txt">
          <div class="t1" id="pickName">还没选</div>
          <div class="t2" id="pickMeta">点右上「选择」挑一个音频</div>
        </div>
      </div>

      <div class="preview" id="preview" style="display:none">
        <audio id="player" controls></audio>
      </div>

      <div id="audioHistWrap" style="display:none">
        <div class="hd">
          <span class="lab">最近用过</span>
          <button class="act" id="btnClearAudio">清空</button>
        </div>
        <div id="audioHist"></div>
      </div>
    </div>

    <div id="qqWrap" style="display:none">
      <div class="hd">
        <span class="lab">QQ 最新一条</span>
        <button class="act" id="btnRefreshQQ">刷新</button>
      </div>
      <div id="qqLatest"></div>
    </div>

  </div>

  <div class="foot" id="foot" style="display:none">
    <button class="go" id="btnApply" disabled>替换并发送</button>
    <div class="tip" id="tip">先在 QQ 里录一条再取消</div>
  </div>

</div>

<script type="module">
const $ = s => document.querySelector(s);
const AMP = String.fromCharCode(38);
const ENT = {
  '&': AMP + 'amp;', '<': AMP + 'lt;', '>': AMP + 'gt;',
  '"': AMP + 'quot;', "'": AMP + '#39;'
};
const esc = s => String(s).replace(/[&<>"']/g, c => ENT[c]);

const S = {
  token:null, info:null,
  latest:null,
  audioPick:null,
  audioHist:[],
  perm:false, busy:false, loading:false, pickedUri:''
};
let silk = null;
const TARGET_RATE = 24000;
const LS_PICK = 'audio_pick_v2';
const LS_HIST = 'audio_hist_v2';

const fmtDur = s => (s==null||s<0) ? '—'
  : (s>=60 ? Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0') : s.toFixed(2)+'s');
const fmtSize = b => !b ? '—' : b<1024 ? b+' B' : (b/1024).toFixed(1)+' KB';

function nameTime(n){
  const m = /stream_(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(n);
  if (m) return `${+m[2]}/${+m[3]} ${m[4]}:${m[5]}`;
  const t = /(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})/.exec(n);
  return t ? `${+t[2]}/${+t[3]} ${t[4]}:${t[5]}` : '';
}

let lastH = 0;
let maxH = 0;
try{ maxH = Native.screenHeightDp() * 0.86; }catch(e){ maxH = 600; }

function reportHeight(){
  requestAnimationFrame(()=>{
    const card = document.getElementById('card');
    const h = card.scrollHeight;
    if (h < 1) return;
    if (Math.abs(h - lastH) < 1) return;
    lastH = h;
    // 超过屏幕 86% 就锁住，让 body 自己滚
    if (h > maxH) {
      document.getElementById('bodyEl').style.overflowY = 'auto';
      try{ Native.reportHeight(maxH); }catch(e){}
    } else {
      document.getElementById('bodyEl').style.overflowY = 'visible';
      try{ Native.reportHeight(h); }catch(e){}
    }
  });
}

/* ---------- 本地存储 ---------- */
function loadAudioState(){
  try{
    const p = JSON.parse(localStorage.getItem(LS_PICK) || 'null');
    if (p && p.name && p.uri) S.audioPick = p;
  }catch(e){}
  try{
    const h = JSON.parse(localStorage.getItem(LS_HIST) || '[]');
    S.audioHist = Array.isArray(h) ? h.filter(x=>x && x.uri) : [];
  }catch(e){ S.audioHist = []; }
}
function saveAudioPick(){
  try{
    if (S.audioPick) localStorage.setItem(LS_PICK, JSON.stringify(S.audioPick));
    else localStorage.removeItem(LS_PICK);
  }catch(e){}
}
function saveAudioHist(){
  try{ localStorage.setItem(LS_HIST, JSON.stringify(S.audioHist.slice(0,10))); }catch(e){}
}
function pushAudioHist(item){
  S.audioHist = S.audioHist.filter(x => x.uri !== item.uri);
  S.audioHist.unshift(item);
  S.audioHist = S.audioHist.slice(0,10);
  saveAudioHist();
}

/* ---------- 状态 ---------- */
function refresh(){
  let st = {shizuku:false, perm:false, uin:''};
  try{ st = JSON.parse(Native.status()); }catch(e){}

  S.perm = !!st.perm;
  const pip = $('#pip'), who = $('#who');

  if(!st.shizuku){
    pip.className = 'pip';
    who.textContent = 'Shizuku 未运行';
    showNudge('Shizuku 服务没在运行。打开 Shizuku 点「启动」，再回来。');
  }else if(!st.perm){
    pip.className = 'pip';
    who.textContent = '待授权';
    showNudge('Shizuku 在运行，点下面授权。');
  }else{
    pip.className = 'pip live';
    who.textContent = st.uin ? ('QQ ' + st.uin) : '已就绪';
    $('#nudge').style.display = 'none';
    $('#audioWrap').style.display = 'block';
    $('#qqWrap').style.display = 'block';
    $('#foot').style.display = 'block';
  }
  reportHeight();
  return st;
}
function showNudge(t){
  $('#nudge').style.display = 'block';
  $('#nudgeTxt').textContent = t;
  $('#audioWrap').style.display = 'none';
  $('#qqWrap').style.display = 'none';
  $('#foot').style.display = 'none';
}

/* ---------- 音频渲染 ---------- */
function renderAudio(){
  const a = S.audioPick;
  if(a){
    $('#pickName').textContent = a.name;
    $('#pickMeta').textContent =
      `${a.durStr || fmtDur(a.dur)} · ${fmtSize(a.size)}` +
      (a.srcRate ? ` · 源 ${(a.srcRate/1000).toFixed(1)}k/${a.ch===2?'立体声':'单声道'}` : '');
  }else{
    $('#pickName').textContent = '还没选';
    $('#pickMeta').textContent = '点右上「选择」挑一个音频';
    $('#preview').style.display = 'none';
  }
  renderAudioHist();
  syncBtn();
}

function renderAudioHist(){
  const box = $('#audioHist');
  const list = S.audioHist;
  if(!list.length){
    $('#audioHistWrap').style.display = 'none';
    box.innerHTML = '';
    reportHeight();
    return;
  }
  $('#audioHistWrap').style.display = 'block';

  const isSel = i => S.audioPick && S.audioPick.uri === i.uri;

  box.innerHTML = '';
  list.forEach((it, idx)=>{
    const el = document.createElement('div');
    el.className = 'row' + (isSel(it) ? ' sel' : '');
    el.innerHTML = `
      <span class="dot"></span>
      <div class="main">
        <div class="l1">${esc(it.name)}</div>
        <div class="l2">${esc(it.durStr || fmtDur(it.dur))} · ${esc(fmtSize(it.size))}</div>
      </div>
      <button class="kill" data-i="${idx}" aria-label="删除"></button>`;

    el.onclick = e=>{
      if(e.target.classList.contains('kill')) return;
      useAudioItem(it);
    };
    el.querySelector('.kill').onclick = e=>{
      e.stopPropagation();
      S.audioHist.splice(idx,1);
      saveAudioHist();
      if(isSel(it)){ S.audioPick = null; S.token = null; saveAudioPick(); }
      renderAudio();
      Native.toast('已移除');
    };
    box.appendChild(el);
  });
  reportHeight();
}

/* 点历史 → 直接重读那个 URI 再编码 */
async function useAudioItem(it){
  $('#pickName').textContent = it.name;
  $('#pickMeta').textContent = '读取中…';
  try{
    const f = await uriToFile(it.uri, it.name);
    const { pv } = await build(f);
    S.audioPick = Object.assign({}, it, {
      dur: S.info.dur, durStr: fmtDur(S.info.dur),
      size: S.info.size, srcRate: S.info.srcRate, ch: S.info.ch
    });
    saveAudioPick();
    pushAudioHist(S.audioPick);

    $('#player').src = URL.createObjectURL(new Blob([pv], {type:'audio/wav'}));
    $('#preview').style.display = 'block';
    renderAudio();
  }catch(err){
    Native.toast('这条读不到了，请重选');
    $('#pickMeta').textContent = '读不到，请重选';
    reportHeight();
  }
}

function uriToFile(uri, name){
  return new Promise((res, rej)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('GET', uri, true);
    xhr.responseType = 'blob';
    xhr.onload = ()=>{
      if(xhr.status === 200 || xhr.status === 0)
        res(new File([xhr.response], name || 'audio', {type: xhr.response.type || 'audio/mpeg'}));
      else rej(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = ()=> rej(new Error('读取失败'));
    xhr.send();
  });
}

/* Activity 选完文件回调进来 */
window.onAudioPicked = async (uri, name)=>{
  S.pickedUri = uri;
  $('#pickName').textContent = name || '音频';
  $('#pickMeta').textContent = '读取中…';
  $('#btnPick').textContent = '转换中';
  $('#btnPick').disabled = true;
  try{
    const f = await uriToFile(uri, name);
    const { pv } = await build(f);
    const item = {
      name: name || 'audio',
      uri: uri,
      dur: S.info.dur, durStr: fmtDur(S.info.dur),
      size: S.info.size, srcRate: S.info.srcRate, ch: S.info.ch
    };
    S.audioPick = item;
    saveAudioPick();
    pushAudioHist(item);

    $('#pickName').textContent = item.name;
    $('#pickMeta').textContent =
      `${item.durStr} · ${fmtSize(item.size)} · 源 ${(item.srcRate/1000).toFixed(1)}k/${item.ch===2?'立体声':'单声道'}`;
    $('#player').src = URL.createObjectURL(new Blob([pv], {type:'audio/wav'}));
    $('#preview').style.display = 'block';
    renderAudio();
  }catch(err){
    Native.toast('转换失败：' + (err.message||err));
    $('#pickName').textContent = '转换失败，重选';
    $('#pickMeta').textContent = String(err.message||err).slice(0,60);
    reportHeight();
  }finally{
    $('#btnPick').textContent = '选择';
    $('#btnPick').disabled = false;
  }
};

/* ---------- QQ 最新一条 ---------- */
function renderQQ(){
  const box = $('#qqLatest');
  const f = S.latest;

  if(S.loading && !f){
    box.innerHTML = '<div class="empty"><span class="spin"></span> 正在找缓存…</div>';
    reportHeight();
    return;
  }
  if(!f){
    box.innerHTML = '<div class="empty">还没有缓存<br>在 QQ 里录一条、滑到「转文字」再松手</div>';
    reportHeight();
    return;
  }

  box.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'row latest new' + (S.target && S.target.name === f.name ? ' sel' : '');
  el.innerHTML = `
    <span class="dot"></span>
    <div class="main">
      <div class="l1">${fmtDur(f.dur)}<span class="tm">${nameTime(f.name)}</span></div>
      <div class="l2">${esc(f.name)}</div>
    </div>
    <span class="sz">${fmtSize(f.size)}</span>`;
  el.onclick = ()=>{ S.target = f; renderQQ(); syncBtn(); };
  box.appendChild(el);
  reportHeight();
}

function syncBtn(){
  const b = $('#btnApply');
  const ok = S.perm && S.token && S.latest && !S.busy;
  b.disabled = !ok;
  if(!S.latest) $('#tip').textContent = '先在 QQ 里录一条';
  else if(!S.audioPick || !S.token) $('#tip').textContent = '先选个音频';
  else $('#tip').textContent = '将替换最新那条语音';
  reportHeight();
}

/* ---------- 编码 ---------- */
async function decode(file){
  const buf = await file.arrayBuffer();
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(buf);
  await ac.close();
  const len = Math.ceil(audio.duration * TARGET_RATE);
  const off = new OfflineAudioContext(1, len, TARGET_RATE);
  const src = off.createBufferSource();
  src.buffer = audio; src.connect(off.destination); src.start();
  const r = await off.startRendering();
  return { pcm:r.getChannelData(0), srcRate:audio.sampleRate, srcDur:audio.duration, ch:audio.numberOfChannels };
}

function wav16(pcm, rate){
  const n = pcm.length;
  const buf = new ArrayBuffer(44 + n*2);
  const v = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,n*2,true);
  let peak=0;
  for(let i=0;i<n;i++){ const a=Math.abs(pcm[i]); if(a>peak) peak=a; }
  const g = peak>0.95 ? 0.95/peak : 1;
  for(let i=0;i<n;i++){
    let s = pcm[i]*g; if(s>1)s=1; if(s<-1)s=-1;
    v.setInt16(44+i*2, Math.round(s*32767), true);
  }
  return new Uint8Array(buf);
}

function b64(u8){
  let s=''; const CH=0x8000;
  for(let i=0;i<u8.length;i+=CH) s += String.fromCharCode.apply(null, u8.subarray(i,i+CH));
  return btoa(s);
}

async function build(file){
  if(!silk) silk = await import('/lib/index.mjs');
  const { pcm, srcRate, srcDur, ch } = await decode(file);
  const wav = wav16(pcm, TARGET_RATE);
  const enc = await silk.encode(wav, 0);
  const bytes = enc.data;

  const okTag = bytes[0]===0x02;
  let hdr=''; for(let i=1;i<10;i++) hdr += String.fromCharCode(bytes[i]);
  const tailFF = bytes[bytes.length-2]===0xFF && bytes[bytes.length-1]===0xFF;
  let frames=0;
  if(okTag && hdr==='#!SILK_V3'){
    let i=10;
    while(i+2<=bytes.length){
      const n = bytes[i]|(bytes[i+1]<<8); i+=2;
      if(!n||n===0xffff||i+n>bytes.length) break;
      frames++; i+=n;
    }
  }
  if(!(okTag && hdr==='#!SILK_V3' && !tailFF)) throw new Error('编码结构异常');

  const back = await silk.decode(bytes, TARGET_RATE);
  const n = Math.floor(back.data.length/2);
  const f32 = new Float32Array(n);
  const dv = new DataView(back.data.buffer, back.data.byteOffset, back.data.byteLength);
  for(let i=0;i<n;i++) f32[i] = dv.getInt16(i*2,true)/32768;
  const pv = wav16(f32, TARGET_RATE);

  S.token = bytes;
  S.info = { dur: frames*0.02, size: bytes.length, srcRate, srcDur, ch };
  return { pv };
}

/* ---------- 交互 ---------- */
let xTimer = null, xLong = false;
const xBtn = $('#btnClose');

xBtn.onclick = ()=>{
  if(xLong){ xLong = false; return; }
  Native.close();
};
xBtn.addEventListener('pointerdown', ()=>{
  xLong = false;
  xTimer = setTimeout(()=>{
    xLong = true;
    Native.killBall();
  }, 650);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
  xBtn.addEventListener(ev, ()=>{
    if(xTimer){ clearTimeout(xTimer); xTimer = null; }
  })
);

$('#btnAuth').onclick = ()=>{
  Native.requestPerm();
  setTimeout(()=>{ if(refresh().perm) loadList(false); }, 1200);
};

$('#btnPick').onclick = ()=> Native.pickAudio();

$('#btnClearAudio').onclick = ()=>{
  if(!S.audioHist.length) return;
  S.audioHist = [];
  saveAudioHist();
  renderAudio();
  Native.toast('音频记录已清空');
};

$('#btnRefreshQQ').onclick = ()=> loadList(true);

$('#btnApply').onclick = ()=>{
  if(!S.token || !S.latest || S.busy) return;
  S.busy = true; syncBtn();
  $('#btnApply').innerHTML = '<span class="spin"></span> 写入中';
  try{
    const r = JSON.parse(Native.save(S.latest.name, S.latest.dir, b64(S.token), true));
    if(r.ok){
      Native.toast('已替换 · 回 QQ 点那条语音试听');
      $('#foot').style.display = 'none';
      setTimeout(()=> Native.close(), 420);
    }else{
      Native.toast('失败：'+(r.error||'未知'));
    }
  }catch(err){
    Native.toast('异常：'+err.message);
  }finally{
    S.busy = false;
    $('#btnApply').textContent = '替换并发送';
    syncBtn();
  }
};

/* ---------- 列表 ---------- */
function loadList(force){
  if(!S.perm || S.loading) return;
  S.loading = true;
  if(force || !S.latest) renderQQ();
  try{
    const r = JSON.parse(Native.list());
    if(!r.ok){
      S.latest = null; S.target = null;
      S.errMsg = r.error || '读取失败';
    }else{
      const files = r.files || [];
      S.latest = files.length ? files[0] : null;
      S.target = S.latest;
      S.errMsg = '';
    }
  }catch(e){
    S.latest = null; S.target = null;
    S.errMsg = '读取失败';
  }finally{
    S.loading = false;
    if(S.errMsg && !S.latest){
      $('#qqLatest').innerHTML = `<div class="empty">${esc(S.errMsg)}</div>`;
    }else{
      renderQQ();
    }
    syncBtn();
  }
}

/* ---------- 启动 ---------- */
loadAudioState();
try{
  const st = refresh();
  renderAudio();
  renderQQ();
  if(st.perm) setTimeout(()=> loadList(false), 30);
}catch(e){
  $('#who').textContent = '初始化失败';
  showNudge(String(e.message||e));
}

window.onShizukuChanged = ()=>{
  const st = refresh();
  if(st.perm) loadList(false);
};

window.addEventListener('resize', reportHeight);
new ResizeObserver(reportHeight).observe(document.getElementById('card'));
setTimeout(reportHeight, 60);
setTimeout(reportHeight, 300);
</script>
