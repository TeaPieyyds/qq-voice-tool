<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QQ语音助手</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e6e8eb; --text:#1b1f24; --muted:#6b737d;
    --brand:#2f6feb; --brand-soft:#eaf1fe; --ok:#1a7f4b; --ok-soft:#e8f6ee;
    --warn:#9a6700; --warn-soft:#fff8e5; --err:#b42318; --err-soft:#fdeceb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{padding:0 0 calc(84px + env(safe-area-inset-bottom))}
  .wrap{padding:16px 14px 0;max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
  h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.5px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;
    border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:#c3c8ce}
  .dot.on{background:var(--ok)} .dot.warn{background:#d68a00} .dot.off{background:#c3c8ce}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:8px}
  .num{width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
    display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
  .btn{width:100%;height:46px;border-radius:11px;border:1px solid var(--line);background:#fff;
    color:var(--text);font-size:15px;font-weight:500;display:flex;align-items:center;
    justify-content:center;gap:8px}
  .btn:active{background:#f2f4f7}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:active{filter:brightness(.94)}
  .btn:disabled{opacity:.45}
  .btn.small{height:38px;font-size:14px;width:auto;padding:0 16px}
  .hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.65}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .kv>div{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .kv b{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
  .kv span{font-size:14px;font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;gap:10px}
  .list{margin-top:4px}
  .item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f1f3f5}
  .item:last-child{border-bottom:none}
  .more{text-align:center;padding:13px 0 4px;font-size:14px;color:var(--brand)}
  input[type=text]{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);
    padding:0 12px;font:inherit;background:#fff;margin-top:6px}
  #cfgActive{margin-top:10px;padding:9px 11px;background:#fafbfc;border:1px solid var(--line);
    border-radius:9px;font-size:12.5px;line-height:1.6;color:var(--muted);
    word-break:break-all;overflow-wrap:anywhere;white-space:normal;
    font-family:ui-monospace,monospace;user-select:all;display:none}
  #cfgActive.on{display:block}
  details.card summary{font-size:15px;font-weight:600;cursor:pointer;list-style:none}
  details.card summary::-webkit-details-marker{display:none}
  details.card summary::after{content:'▾';float:right;color:var(--muted)}
  details.card[open] summary::after{content:'▴'}
  .item .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #ccd2d9;flex:none}
  .item.sel .radio{border-color:var(--brand);background:var(--brand);
    box-shadow:inset 0 0 0 3px #fff}
  .item .meta{flex:1;min-width:0}
  .item .name{font-size:12px;color:var(--muted);font-family:ui-monospace,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .line1{display:flex;align-items:center;gap:8px;font-size:14px}
  .tag{font-size:11px;padding:1px 7px;border-radius:999px;background:#eef1f4;color:var(--muted)}
  .tag.new{background:var(--ok-soft);color:var(--ok)}
  .alert{padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px;display:none;line-height:1.6}
  .alert.show{display:block}
  .alert.ok{background:var(--ok-soft);color:var(--ok)}
  .alert.warn{background:var(--warn-soft);color:var(--warn)}
  .alert.err{background:var(--err-soft);color:var(--err)}
  .footer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(245,246,248,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .footer .inner{max-width:560px;margin:0 auto}
  audio{width:100%;height:36px;margin-top:10px}
  .log{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .log div::before{content:"·";margin-right:6px;color:#b9bfc6}
  .spin{width:14px;height:14px;border:2px solid #dfe3e8;border-top-color:var(--brand);
    border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>QQ 语音助手</h1>
    <span class="badge" id="status"><span class="dot off"></span>检查中</span>
  </header>

  <section class="card" id="authCard" style="display:none">
    <h2><span class="num">!</span>需要 Shizuku 授权</h2>
    <div class="hint" id="authHint" style="margin-top:0">
      手机 QQ 的语音目录受系统保护，普通 App 无法写入，需要借 Shizuku 的 shell 权限。
    </div>
    <button class="btn primary" id="btnAuth" style="margin-top:12px">授权</button>
  </section>

  <section class="card">
    <h2><span class="num">1</span>选择音频</h2>
    <button class="btn" id="btnPick">从文件里选一个音频</button>
    <input type="file" id="file" accept="audio/*" hidden>
    <div class="kv" id="kv" style="display:none"></div>
    <audio id="player" controls style="display:none"></audio>
    <div class="alert" id="buildAlert"></div>
  </section>

  <section class="card">
    <h2><span class="num">2</span>要替换的语音
      <button class="btn small" id="btnRefresh" style="margin-left:auto">刷新</button>
    </h2>
    <div class="hint" id="dirHint" style="margin-top:0">正在读取…</div>
    <div class="list" id="list"></div>
  </section>

  <details class="card" id="settings">
    <summary>设置（默认自动查找）</summary>
    <div class="hint" style="margin-top:6px">
      留空就用默认规则扫描（自动试 5 个候选根目录、按最新录音选账号）。
      多账号时填 QQ 号可指定；路径特殊时把 ptt 目录粘进第二个框。
    </div>
    <div style="margin-top:12px">
      <label class="hint" style="margin:0">QQ 号</label>
      <input id="cfgUin" type="text" inputmode="numeric" placeholder="选填 · 多账号时指定">
    </div>
    <div style="margin-top:10px">
      <label class="hint" style="margin:0">语音目录（可留空）</label>
      <input id="cfgDir" type="text" placeholder="…/Tencent/MobileQQ/QQ号/ptt">
    </div>
    <div class="row" style="margin-top:12px;gap:8px">
      <button class="btn primary" id="btnSaveCfg" style="flex:2">保存并重新扫描</button>
      <button class="btn" id="btnResetCfg" style="flex:1">恢复默认</button>
    </div>
    <div id="cfgActive"></div>
  </details>

  <div class="log" id="log"></div>
</div>

<div class="footer"><div class="inner">
  <button class="btn primary" id="btnApply" disabled>替换并发送</button>
</div></div>

<script type="module">
const $ = s => document.querySelector(s);
const state = { token:null, info:null, files:[], target:null, ready:false, perm:false, expanded:false };
const COLLAPSE = 5;
let silk = null;

function fmtDur(s){ if(s==null||s<0) return '—'; return s>=60 ? Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0') : s.toFixed(2)+'s'; }
function fmtSize(b){ if(!b) return '—'; return b<1024? b+' B' : (b/1024).toFixed(1)+' KB'; }
function fmtNameTime(n){
  const m=/stream_(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/.exec(n);
  return m ? `${+m[2]}/${+m[3]} ${m[4]}:${m[5]}` : '';
}
function alertBox(el, kind, msg){ el.className='alert show '+kind; el.textContent=msg; }
function clearAlert(el){ el.className='alert'; el.textContent=''; }
function log(t){ const d=document.createElement('div'); d.textContent=t; $('#log').appendChild(d); }

/* ---------- 状态 ---------- */
window.onShizukuChanged = ()=>{
  const st = refreshStatus();
  if(st.perm){ log('Shizuku 状态已更新'); if(!state.files.length) loadList(); }
};

function renderActive(dir){
  const el = $('#cfgActive');
  if(!dir){ el.className=''; el.textContent=''; return; }
  el.className='on';
  el.innerHTML = '<span style="font-family:inherit;color:#8a929b">当前目录</span><br>' + escapeHtml(dir);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function refreshStatus(){
  const st = JSON.parse(Native.status());
  state.perm = st.perm; state.ready = st.perm;
  const b = $('#status');
  if(!st.shizuku){
    b.innerHTML = '<span class="dot warn"></span>Shizuku 未运行';
    $('#authCard').style.display='block';
    $('#authHint').textContent = 'Shizuku 服务没在运行。打开 Shizuku 应用，点「启动」（手机重启过就需要这一步），再回到这里。';
  } else if(!st.perm){
    b.innerHTML = '<span class="dot warn"></span>待授权';
    $('#authCard').style.display='block';
    $('#authHint').textContent = 'Shizuku 已在运行，点下面的按钮授权给本应用。';
  } else {
    b.innerHTML = '<span class="dot on"></span>已就绪';
    $('#authCard').style.display='none';
  }
  b.onclick = ()=>{ const s2=refreshStatus(); if(s2.perm) loadList(); else Native.toast('Shizuku 还没就绪'); };
  if(st.dir) $('#dirHint').textContent = `QQ ${st.uin} · ${st.dir}`;
  try{ const c2=JSON.parse(Native.getConfig()); renderActive(c2.active); }catch(e){}
  return st;
}

/* ---------- 音频处理 ---------- */
const TARGET_RATE = 24000;

async function decodeToMono(file){
  const buf = await file.arrayBuffer();
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(buf);
  await ac.close();
  const len = Math.ceil(audio.duration * TARGET_RATE);
  const off = new OfflineAudioContext(1, len, TARGET_RATE);
  const src = off.createBufferSource();
  src.buffer = audio;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  return { pcm: rendered.getChannelData(0), srcRate: audio.sampleRate, srcDur: audio.duration, channels: audio.numberOfChannels };
}

function toWav16(pcm, rate){
  const n = pcm.length;
  const buf = new ArrayBuffer(44 + n*2);
  const v = new DataView(buf);
  const w = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, n*2, true);
  let peak = 0;
  for(let i=0;i<n;i++){ const a=Math.abs(pcm[i]); if(a>peak) peak=a; }
  const g = peak > 0.95 ? 0.95/peak : 1;
  for(let i=0;i<n;i++){
    let s = pcm[i]*g; if(s>1)s=1; if(s<-1)s=-1;
    v.setInt16(44+i*2, Math.round(s*32767), true);
  }
  return { wav: new Uint8Array(buf), gain: g };
}

async function build(file){
  clearAlert($('#buildAlert')); $('#kv').style.display='none';
  $('#btnPick').innerHTML = '<span class="spin"></span> 正在转换…';
  try{
    if(!silk){ silk = await import('/lib/index.mjs'); }
    log(`选中文件：${file.name} · ${fmtSize(file.size)}`);
    const { pcm, srcRate, srcDur, channels } = await decodeToMono(file);
    log(`解码结果：${srcDur.toFixed(2)}s · ${srcRate}Hz · ${channels}声道 · PCM ${pcm.length} 采样`);
    const { wav, gain } = toWav16(pcm, TARGET_RATE);
    const enc = await silk.encode(wav, 0);
    const bytes = enc.data;
    // 用手机端视角回听：把 slk 解回 PCM
    const back = await silk.decode(bytes, TARGET_RATE);
    const backPcm = new Float32Array(back.data.length/2);
    const dv = new DataView(back.data.buffer, back.data.byteOffset, back.data.byteLength);
    for(let i=0;i<backPcm.length;i++) backPcm[i] = dv.getInt16(i*2, true)/32768;
    const { wav: pv } = toWav16(backPcm, TARGET_RATE);

    // 结构统计
    let frames=0, okTag = bytes[0]===0x02;
    let hdr=''; for(let i=1;i<10;i++) hdr += String.fromCharCode(bytes[i]);
    let tailFF = bytes[bytes.length-2]===0xFF && bytes[bytes.length-1]===0xFF;
    if(okTag && hdr==='#!SILK_V3'){
      let i=10;
      while(i+2<=bytes.length){ const n=bytes[i]|(bytes[i+1]<<8); i+=2; if(!n||n===0xffff||i+n>bytes.length) break; frames++; i+=n; }
    }
    const dur = frames*0.02;
    state.token = bytes;
    state.info = { dur, bytes: bytes.length, frames, srcRate, srcDur, channels, gain };

    $('#kv').style.display='grid';
    $('#kv').innerHTML = `
      <div><b>成品时长</b><span>${fmtDur(dur)}</span></div>
      <div><b>文件大小</b><span>${fmtSize(bytes.length)}</span></div>
      <div><b>源音频</b><span>${(srcRate/1000)}k · ${channels===2?'立体声':'单声道'}</span></div>
      <div><b>结构校验</b><span>${okTag&&hdr==='#!SILK_V3'&&!tailFF?'通过':'异常'}</span></div>`;

    const blob = new Blob([pv], {type:'audio/wav'});
    const pl = $('#player'); pl.src = URL.createObjectURL(blob); pl.style.display='block';
    alertBox($('#buildAlert'),'ok','转换完成，可试听（这是手机端实际听到的音质）');
    syncButtons();
  }catch(e){
    alertBox($('#buildAlert'),'err','转换失败：'+(e.message||e));
  }finally{
    $('#btnPick').textContent = '从文件里选一个音频';
  }
}

/* ---------- 列表 ---------- */
function renderList(){
  const box = $('#list'); box.innerHTML='';
  if(!state.files.length){ box.innerHTML = '<div class="hint">还没有语音记录。先在 QQ 里录一条再取消，然后点「刷新」。</div>'; return; }
  const shown = state.expanded ? state.files : state.files.slice(0, COLLAPSE);
  shown.forEach((f,idx)=>{
    const el = document.createElement('div');
    el.className = 'item' + (state.target && state.target.name===f.name ? ' sel':'');
    el.innerHTML = `<div class="radio"></div>
      <div class="meta">
        <div class="line1">${fmtDur(f.dur)} <span style="color:var(--muted);font-size:13px">${fmtNameTime(f.name)}</span>
          ${idx===0?'<span class="tag new">最新</span>':''}</div>
        <div class="name">${f.name}</div>
      </div>
      <div style="font-size:12.5px;color:var(--muted)">${fmtSize(f.size)}</div>`;
    el.onclick = ()=>{ state.target = f; renderList(); syncButtons(); };
    box.appendChild(el);
  });
  if(state.files.length > COLLAPSE){
    const more = document.createElement('div');
    more.className = 'more';
    more.textContent = state.expanded
      ? '收起'
      : `展开全部 ${state.files.length} 条 ▾`;
    more.onclick = ()=>{ state.expanded = !state.expanded; renderList(); };
    box.appendChild(more);
  }
}

function loadList(){
  $('#dirHint').textContent = '正在读取…';
  const r = JSON.parse(Native.list());
  if(!r.ok){ $('#dirHint').textContent = r.error || '读取失败'; state.files=[]; renderList(); return; }
  state.files = r.files || [];
  $('#dirHint').textContent = `共 ${state.files.length} 条 · 已自动选中最新一条`;
  state.target = state.files[0] || null;
  renderList(); syncButtons();
}

function syncButtons(){
  $('#btnApply').disabled = !(state.token && state.target && state.perm);
}

/* ---------- 应用 ---------- */
async function apply(){
  if(!state.token || !state.target) return;
  $('#btnApply').disabled = true;
  $('#btnApply').innerHTML = '<span class="spin"></span> 正在写入';
  try{
    const b64 = base64FromBytes(state.token);
    const r = JSON.parse(Native.save(state.target.name, state.target.dir, b64, true));
    if(!r.ok) throw new Error(r.error);
    log(`已替换 ${state.target.name}（${fmtSize(r.size)}）`);
    if(r.backup) log('原文件已备份到 ' + r.backup);
    Native.toast('替换完成，回 QQ 点开那条语音试听');
    loadList();
  }catch(e){
    Native.toast('替换失败：'+e.message);
    log('失败：'+e.message);
  }finally{
    $('#btnApply').textContent = '替换并发送';
    syncButtons();
  }
}

function base64FromBytes(u8){
  let s='';
  const chunk = 0x8000;
  for(let i=0;i<u8.length;i+=chunk){
    s += String.fromCharCode.apply(null, u8.subarray(i, i+chunk));
  }
  return btoa(s);
}

/* ---------- 事件 ---------- */
$('#btnPick').onclick = ()=> $('#file').click();
$('#file').onchange = e => { const f=e.target.files[0]; if(f) build(f); e.target.value=''; };
$('#btnRefresh').onclick = loadList;
$('#btnApply').onclick = apply;
$('#btnResetCfg').onclick = ()=>{
  Native.setConfig('', '');
  $('#cfgUin').value = ''; $('#cfgDir').value = '';
  state.files = []; state.target = null;
  renderActive('');
  const st = refreshStatus();
  if(st.perm) loadList();
  Native.toast('已恢复自动查找');
};
$('#btnSaveCfg').onclick = ()=>{
  Native.setConfig($('#cfgUin').value.trim(), $('#cfgDir').value.trim());
  state.files = []; state.target = null;
  Native.toast('设置已保存');
  const st = refreshStatus();
  if(st.perm) loadList(); else log('还没授权，设置已保存，授权后生效');
};
$('#btnAuth').onclick = ()=>{ Native.requestPerm(); setTimeout(()=>{ const st=refreshStatus(); if(st.perm){ loadList(); } }, 1200); };

(async ()=>{
  try{
    const cfg = JSON.parse(Native.getConfig());
    $('#cfgUin').value = cfg.uin || '';
    $('#cfgDir').value = cfg.dir || '';
    renderActive(cfg.active);
  }catch(e){}
  const st = refreshStatus();
  if(st.perm) loadList();
  else Native.toast('需要先授权 Shizuku');

  // 引擎自检：跑一遍 24k 单声道 → SILK → 结构校验
  try{
    if(!silk) silk = await import('/lib/index.mjs');
    const rate=24000, n=rate*0.5, pcm=new Float32Array(n);
    for(let i=0;i<n;i++) pcm[i]=0.3*Math.sin(2*Math.PI*440*i/rate);
    const { wav } = toWav16(pcm, rate);
    const enc = await silk.encode(wav, 0);
    const b = enc.data;
    const ok = b[0]===0x02 && String.fromCharCode(...b.subarray(1,10))==='#!SILK_V3';
    log(`引擎自检：${ok?'通过':'异常'} · ${b.length} 字节`);
  }catch(e){
    log('引擎自检失败：'+(e.message||e));
  }
})();
</script>
</body>
</html>
